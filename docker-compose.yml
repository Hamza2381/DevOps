version: '3.8'

services:
  web:
    build: .
    container_name: webapp_part1
    ports:
      - "80:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SESSION_SECRET=supersecretkey123
      - DB_PATH=/app/data/job_portal.db
    volumes:
      - sqlite_data:/app/data        # persistent volume for SQLite DB
    restart: unless-stopped

volumes:
  sqlite_data:
